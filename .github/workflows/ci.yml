name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The schema, not the data. CI gets a real Postgres and the real
    # migrations, so anything that depends on a column, a constraint or an
    # index is genuinely exercised. The restored production database — 60 real
    # people's names, emails and leagues — stays off the runner, which is why
    # the contract tests are excluded from `test:ci` rather than run against a
    # hollow copy. Same major as production (17).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinemadraft
          POSTGRES_PASSWORD: local
          POSTGRES_DB: cinemadraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cinemadraft:local@localhost:5432/cinemadraft

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Biome covers lint, formatting, and import order in one pass. It does
      # not typecheck, so tsc is a separate step.
      - name: Lint
        run: npm run lint

      # `typecheck` runs `next typegen` first. LayoutProps, PageProps and
      # friends are generated by Next rather than written by hand, so a bare
      # `tsc` on a clean tree fails with "Cannot find name 'LayoutProps'".
      # Folding typegen into the script means local and CI cannot diverge.
      - name: Typecheck
        run: npm run typecheck

      # Create the schema the tests run against. `migrate deploy` applies the
      # committed migrations exactly as production will receive them, so a
      # migration that is broken fails here rather than at cutover.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # The subset that can run without the production data — see
      # vitest.ci.config.mts. This still covers every security test in the
      # project: the claim rules, session resolution, webhook signature
      # verification and the admin relink guard.
      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      # E2E runs here, with Clerk absent rather than credentialled (D84).
      #
      # D43 kept this a local gate: the owner declined to store Clerk
      # credentials in GitHub, and the app could not render without them.
      # D82's test session removes the premise rather than overruling the
      # objection — under `E2E_TEST_AUTH=1` the app boots with no Clerk at all,
      # so there is nothing to store. The Clerk-driven specs stay local-only
      # and skip themselves visibly here, because they test Clerk itself and
      # nothing can stand in for it.
      #
      # 🔴 The flag is a boot failure on Vercel, not a setting. `lib/test-auth.ts`
      # throws at import if `VERCEL_ENV` is set alongside it, so it cannot be
      # carried from here into a deployment by copying an env block.
      - name: A signing secret for the test session
        # Generated per run rather than stored: nothing outside this job ever
        # needs to verify it, and a secret nobody keeps is a secret nobody
        # leaks. 64 hex characters, comfortably over the 32 the module demands.
        run: echo "E2E_TEST_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # 🔴 The one row the app cannot boot without.
      #
      # This job's whole premise is schema without data, and until P15.T11 that
      # cost nothing: the Playwright steps were gated behind
      # `if: env.CLERK_SECRET_KEY != ''`, which is never true here, so the e2e
      # job had never actually run on CI. D84 removed the gate — and the first
      # real run found that `/` throws `no seasons exist` with no row in
      # `available_years`, which is correct behaviour and stays (the owner's
      # call: an empty production database is not a state worth degrading into).
      # But `/` and `/award-shows` are where three specs start, and Playwright's
      # own readiness probe polled `/` for the full 180 seconds and then failed
      # the job without running a single test.
      #
      # So: the season, and deliberately nothing else. Every spec that needs a
      # league, a seat, a film or a show creates it and deletes it again; the
      # three that genuinely need the restored corpus skip themselves visibly
      # (see e2e/support/corpus.ts). Anything more seeded here is a row a future
      # spec can lean on instead of making its own, which is how a suite stops
      # proving anything on a fresh database.
      - name: Seed the one row the app cannot boot without
        run: node scripts/seed-e2e.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright's webServer builds and starts the app itself. The build
      # above is not redundant: it fails fast with a readable error before
      # the browser download, rather than surfacing as a webServer timeout.
      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The repository layer is the only code allowed to touch Prisma (spec §5).
  # It is an architectural rule that nothing else enforces: an import from a
  # component compiles, passes tests, and quietly leaks Prisma types into the
  # UI, which is exactly what this port is trying to avoid.
  #
  # The boundary is drawn in two places rather than one, because the two kinds
  # of import have different costs:
  #
  #   - A *type* import is erased at compile time. Repositories use it to
  #     derive their DTOs from the generated models, so the field types cannot
  #     drift from the schema. That is cheap and desirable, and allowed there.
  #   - A *value* import drags the Prisma runtime into whatever bundle imports
  #     it. Only lib/db.ts may do that.
  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: The UI layers never reference Prisma, even for types
        run: |
          set -uo pipefail
          offenders=$(grep -rlE "from ['\"][^'\"]*generated/prisma" app actions components 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::app, actions and components must consume repository DTOs, never Prisma types"
            echo "$offenders"
            exit 1
          fi
          echo "UI layers are Prisma-free"

      - name: Under lib, only db.ts and repositories reference Prisma
        run: |
          set -uo pipefail
          offenders=$(grep -rlE "from ['\"][^'\"]*generated/prisma" lib 2>/dev/null \
            | grep -v -e '^lib/db\.ts$' -e '^lib/repositories/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::only lib/db.ts and lib/repositories/ may reference the generated client"
            echo "$offenders"
            exit 1
          fi
          echo "Prisma reference boundary intact"

      - name: Only lib/db.ts imports Prisma as a value
        run: |
          set -uo pipefail
          # A type import is erased; a value import pulls in the runtime. Our
          # style puts each import on one line, so a line that mentions the
          # generated client without opening with `import type` is a value
          # import.
          offenders=$(grep -rnE "from ['\"][^'\"]*generated/prisma" app lib actions components 2>/dev/null \
            | grep -v '^lib/db\.ts:' \
            | grep -vE ':[0-9]+:[[:space:]]*import type ' || true)
          if [ -n "$offenders" ]; then
            echo "::error::only lib/db.ts may import Prisma as a value; everywhere else must use 'import type'"
            echo "$offenders"
            exit 1
          fi
          echo "no stray Prisma value imports"

      - name: Only repositories import the db client
        run: |
          set -uo pipefail
          # Test files are exempt, and only test files. The rule exists so that
          # shipped code cannot reach the database around the repository layer;
          # a test asserting what a row actually contains has to read it
          # directly, and that is the point of those tests. The exclusion is by
          # filename suffix so a non-test file cannot claim it.
          offenders=$(grep -rln "from '@/lib/db'" app actions components 2>/dev/null \
            | grep -v -E '\.test\.tsx?$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::only lib/repositories/ may import the db client"
            echo "$offenders"
            exit 1
          fi
          echo "db client boundary intact"

      - name: Only the journey pacing helper waits on a clock
        run: |
          # Pacing is a knob (D85), and a knob has exactly one place it is
          # turned. `e2e/journeys/support/pace.ts` owns the suite's only
          # `waitForTimeout`; anywhere else a hardcoded sleep is a flake with a
          # delay on it, and CI pays for it on every run forever.
          if grep -rn 'waitForTimeout' e2e | grep -v '^e2e/journeys/support/pace\.ts:'; then
            echo "a deliberate wait belongs in e2e/journeys/support/pace.ts"
            exit 1
          fi
          echo "only the pacing helper waits on a clock"

      - name: Components carry no raw hex colours
        run: |
          set -uo pipefail
          # Colour lives in theme/ and app/globals.css. A hex literal under
          # components/ or app/ is a colour outside the token system: it cannot
          # be themed, it does not swap between light and dark, and no contrast
          # test covers it — which is how an unreadable value ships.
          #
          # theme/ is deliberately not scanned. That is where the hex values are
          # supposed to be.
          #
          # 🔴 `app/global-error.tsx` is the one exemption, and it is narrow.
          # That boundary replaces <html> and <body> when the ROOT LAYOUT
          # itself has failed — so the providers, the fonts and globals.css are
          # exactly what may not have loaded. Its colours are written as
          # `var(--color-bg-base, #0b0d10)`: the token when the stylesheet is
          # there, a literal when it is not. Without the fallback a total
          # failure renders as black text on a transparent ground, which is the
          # one moment the app cannot afford to be unreadable.
          #
          # Exempted by filename rather than by a comment marker, so it cannot
          # spread: any other file that wants a literal has to change this
          # rule and explain why.
          offenders=$(grep -rnE "#[0-9a-fA-F]{3,8}\\b" components app .storybook \
            --include='*.tsx' --include='*.ts' --include='*.mdx' 2>/dev/null \
            | grep -v '^app/global-error\.tsx:' || true)
          if [ -n "$offenders" ]; then
            echo "::error::raw hex colours outside the token system; add the colour to theme/tokens.ts instead"
            echo "$offenders"
            exit 1
          fi
          echo "no raw hex outside the token system"

      - name: Only RemoteImage imports next/image
        run: |
          set -uo pipefail
          # RemoteImage's whole reason to exist is that the optimization
          # decision for a remote host lives in one place (lib/images.ts). A
          # call site that reaches for next/image directly bypasses that
          # decision silently — it compiles, passes every other check, and
          # opts its page into billed transformations (or an unoptimized
          # fetch that should have been billed) with nobody noticing until a
          # Vercel invoice or a broken image does the noticing instead.
          offenders=$(grep -rlE "from ['\"]next/image['\"]" app lib actions components 2>/dev/null \
            | grep -v -e '^components/ui/RemoteImage\.tsx$' -e '\.test\.tsx?$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::only components/ui/RemoteImage.tsx may import next/image directly"
            echo "$offenders"
            exit 1
          fi
          echo "next/image import boundary intact"

      - name: Text sizes come from the scale
        run: |
          set -uo pipefail
          # P17.T18. The type scale lives in app/globals.css and nowhere else.
          #
          # An arbitrary `text-[13px]` compiles, looks fine, and quietly forks
          # the scale — which is how 117 elements came to render at 10.4px from
          # a single `text-[0.65rem]`, below the 11px Eyebrow floor and outside
          # the scale entirely.
          #
          # The exempt files each OWN a documented value: Eyebrow the 11px floor
          # (D74), SectionHead the 28/20/17 heading ramp (P17.T1), Wordmark the
          # lockup (D83), TabBar its 11px tab labels (P17.T2 measured the 390px
          # row at 78px a slot with no slack — 13px wraps it), and EmptyState a
          # copy of SectionHead's h3 that should become `SectionHead as="h3"`.
          # Test and story files are exempt because their arbitrary sizes are
          # assertions about those files, not new call sites.
          offenders=$(grep -rnE "text-\[[0-9.]+(px|rem|em)\]" components app .storybook \
            --include='*.tsx' --include='*.ts' --include='*.mdx' 2>/dev/null \
            | grep -v -e '^components/ui/Eyebrow\.tsx:' -e '^components/ui/SectionHead\.tsx:' \
                      -e '^components/ui/Wordmark\.tsx:' -e '^components/shell/TabBar\.tsx:' \
                      -e '^components/ui/EmptyState\.tsx:' \
                      -e '\.test\.tsx\?:' -e '\.stories\.tsx\?:' \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::arbitrary text sizes fork the scale; use text-xs/text-sm/text-base from app/globals.css"
            echo "$offenders"
            exit 1
          fi
          echo "text sizes come from the scale"

      - name: Spacing sits on the 4px grid
        run: |
          set -uo pipefail
          # P17.T24. Tailwind's integer steps are 0.25rem apart, so every
          # integer is already on the grid — the only ways off it are a `.5`
          # step (gap-1.5 = 6px, px-2.5 = 10px, gap-0.5 = 2px) and an arbitrary
          # value.
          #
          # 🔴 Deliberately scoped to gap/padding/margin. `w-*` and `h-*` are
          # excluded because PosterFrame's 2px score bar and SeenMeter's 6px
          # meter track are drawn objects whose size IS the design; rounding a
          # hairline to the grid doubles it, and a check that demands a wrong
          # edit gets deleted.
          #
          # The leading class includes `:` so a variant-prefixed `sm:gap-1.5`
          # is caught — that is how AppShell's `xl:gap-2.5 xl:p-2.5` was found.
          offenders=$(grep -rnE "(^|[\"' :])-?(gap|gap-x|gap-y|space-x|space-y|p|px|py|pt|pr|pb|pl|m|mx|my|mt|mr|mb|ml)-([0-9]+\.5|\[[0-9.]+(px|rem|em)\])" \
            components app .storybook --include='*.tsx' --include='*.mdx' 2>/dev/null \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::spacing off the 4px grid; use an integer Tailwind step"
            echo "$offenders"
            exit 1
          fi
          echo "spacing sits on the 4px grid"

      - name: Radius comes from the scale
        run: |
          set -uo pipefail
          # P17.T25. D73's scale, anchored at 6px. Measured pre-sweep: sm ×116
          # against md ×94, because Panel — the primitive every page composes
          # from — hardcoded `md`, so the documented anchor was not the real
          # one. (The plan's "58 to 36" does not reproduce on this tree.)
          #
          # `lg` (16px) has exactly one legitimate consumer, the full-width
          # search overlay, and is exempted by name rather than left as an
          # undiscussed dead token.
          #
          # `rounded-full` and `rounded-pill` are not radius: the first makes
          # circles (avatars, dots, toggles), the second is D73's chip
          # treatment. Neither is `poster-radius`, the proportional clamp.
          offenders=$(grep -rnE "rounded-(md|lg)\b|rounded-\[[0-9.]+(px|rem|%)\]" \
            components app .storybook --include='*.tsx' --include='*.mdx' 2>/dev/null \
            | grep -v -e '^components/shell/SearchOverlay\.tsx:' -e '\.test\.tsx\?:' || true)
          if [ -n "$offenders" ]; then
            echo "::error::radius outside D73's scale; rounded-sm is the 6px default"
            echo "$offenders"
            exit 1
          fi
          echo "radius comes from the scale"

      - name: No retired surface token names
        run: |
          set -uo pipefail
          # P17.T22. 🔴 This is the check D77 said could not exist, and it is
          # the reason the rename was allowed to happen at all. D77 declined it
          # in 2026-08 because "no test could catch a missed one" — true then,
          # and this grep is the answer. `bg.raised` is now `bg.surface`,
          # `bg.surface` is `bg.panel`, `bg.base` is `bg.ground`, and a new file
          # written from an old example fails here rather than shipping a
          # colour nobody chose.
          #
          # 🔴 Not total, and saying so is part of the check: it catches `base`
          # and `raised`, the two RETIRED spellings, and that is all it can
          # catch, because `surface` is a live name after the rename. A file
          # writing `bg-panel` where it meant `bg-surface` is covered by
          # e2e/visual.spec.ts's 48-screenshot pair, not by this grep.
          offenders=$(grep -rnE -e "-bg-(base|raised)\b|--color-bg-(base|raised)\b|bg\.(base|raised)\b" \
            components app lib theme .storybook \
            --include='*.tsx' --include='*.ts' --include='*.css' --include='*.mdx' 2>/dev/null \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::retired surface names; base is ground, surface is panel, raised is surface"
            echo "$offenders"
            exit 1
          fi
          echo "no retired surface token names"

      - name: No 🔴 in test titles
        run: |
          set -uo pipefail
          # A reporter prints the title beside the result, and a red circle
          # there reads as a failure on every green run. Comments keep theirs.
          offenders=$(grep -rnE "(it|test|describe)(\.[a-z]+)*\([[:space:]]*['\"\`]🔴" \
            app components lib actions theme e2e test scripts .storybook proxy.test.ts \
            --include='*.ts' --include='*.tsx' --include='*.mts' 2>/dev/null \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::a test title starts with 🔴; say what it guards in words instead"
            echo "$offenders"
            exit 1
          fi
          echo "no 🔴 in test titles"

  # package-lock.json must be generated on Linux.
  #
  # lightningcss (via Tailwind 4 and Vite) declares optional per-platform
  # binaries. A lockfile generated on macOS arm64 is wrong for Linux in one of
  # two ways depending on npm version: npm 11.13 writes the darwin-x64 entries
  # with no `version` field at all (npm 11.17 then rejects the lockfile with
  # the inscrutable "Invalid Version:"), and npm 11.17 omits them entirely
  # (npm ci then fails with "Missing: lightningcss-darwin-x64 from lock file").
  #
  # `npm run lock` regenerates it inside the same node:24 image CI uses. This
  # job fails fast and explains itself if someone regenerates it any other way.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Every lockfile entry has a version
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages ?? {})
              .filter(([path, meta]) => path !== "" && meta.version === undefined)
              .map(([path]) => path);
            if (bad.length) {
              console.error("::error::" + bad.length + " lockfile entries have no version field.");
              console.error(bad.join("\n"));
              console.error("Regenerate with: npm run lock");
              process.exit(1);
            }
            console.log("all " + Object.keys(lock.packages).length + " entries versioned");
          '

      - name: Lockfile matches what Linux npm resolves
        run: |
          cp package-lock.json /tmp/committed.json
          # --ignore-scripts is required, not tidiness. This job never runs
          # `npm ci`, so there is no node_modules — and package.json's
          # postinstall is `prisma generate`, whose binary is therefore
          # missing. Without this the step dies with exit 127 before ever
          # comparing the lockfile, and the redirect below hides the reason.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! diff -q /tmp/committed.json package-lock.json >/dev/null; then
            echo "::error::package-lock.json differs from what npm resolves on Linux."
            echo "It was probably regenerated on macOS. Run: npm run lock"
            diff /tmp/committed.json package-lock.json | head -40
            exit 1
          fi
          echo "lockfile is platform-complete"

  # The fixtures committed under fixtures/ are generated by
  # scripts/scrub-fixtures.mjs from the raw capture in .local/, which is
  # gitignored and exists only on the maintainer's machine. CI cannot
  # regenerate them, but it can prove nothing personal ever lands in them.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: No real identifiers in committed fixtures
        # Every `grep` here exits non-zero on *no match*, which is the passing
        # case. GitHub runs steps under `bash -e`, so each one needs `|| true`
        # or the step aborts silently before printing anything.
        run: |
          set -uo pipefail
          fail=0

          # Extract every address, then check each one — not each file.
          # Every scrubbed address ends in @example.test by construction.
          bad_emails=$(grep -rhoE '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}' fixtures/ \
            | { grep -v '@example\.test$' || true; } | sort -u)
          if [ -n "$bad_emails" ]; then
            echo "::error::non-example.test email address in fixtures/"
            echo "$bad_emails"
            fail=1
          fi

          # The Gravatar URL path is an MD5 of the email, so it is
          # email-derived even though it contains no address.
          gravatar=$(grep -rl 'gravatar\.com' fixtures/ || true)
          if [ -n "$gravatar" ]; then
            echo "::error::Gravatar URL in fixtures/"
            echo "$gravatar"
            fail=1
          fi

          # Deliberately no check for Auth0 subject identifiers. The scrubber
          # emits `auth0|` followed by 24 hex characters — the exact shape of
          # a real one, so that format validation still passes. Scrubbed and
          # real are therefore indistinguishable to a pattern match, and any
          # regex here would either fire on every scrubbed file or catch
          # nothing. That property is enforced where it can be: the scrubber's
          # own verification pass, which knows the original values.

          if [ $fail -eq 0 ]; then echo "fixtures clean"; fi
          exit $fail
